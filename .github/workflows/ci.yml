name: Local models and evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg

jobs:
  offline-evidence:
    name: Offline app and saved evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check tracked publication scope and credential patterns
        run: python .github/scripts/check_publication.py
      - name: Check the Lab engine against Qiskit, and its numbers against the saved hardware and research records
        run: node --test lab/test_engine.cjs lab/test_data.cjs lab/test_research.cjs
      - name: Verify the Lab data bundle and single-file Lab match their sources
        run: |
          python lab/make_data.py --check
          python lab/build.py --check
      - name: Check original and current app evidence parity
        run: node --test laser-diagnostics-app/test_model.cjs
      - name: Check local links, hashes and actual MP4 containers
        run: python laser-diagnostics-app/check_package.py
      - name: Verify the single-file research explorer matches its sources
        run: python laser-diagnostics-app/build_standalone.py --check
      - name: Check the public presentation handoff
        run: python check_finals.py --public
      - name: Verify the retained research artifact manifest
        run: python verify_research_pack.py .
      - name: Verify quantum-dot benchmark and external HOM data
        run: |
          python quantum_dot_bridge/verify_results.py
          python quantum_dot_bridge/reference_hom/import_verify.py
          python quantum_dot_bridge/hom_analysis/independent_check.py
      - name: Confirm checks did not rewrite tracked evidence
        run: git diff --exit-code

  scientific-tests:
    name: Bounded mathematical tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            research-validation/research_requirements.txt
      - name: Install the audited scientific dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test original QRSM circuits and local fake-backend compilation
        run: python .github/scripts/run_tests.py --group core
      - name: Test bounded optical, sensor and process models
        run: python .github/scripts/run_tests.py --group research
      - name: Recompute conditional HOM analysis without changing saved files
        run: python quantum_dot_bridge/hom_analysis/verify_results.py
      - name: Verify saved real IBM results without accessing the cloud
        run: python hardware_campaign/verify_campaign.py
      - name: Recompute the noise-model study and the Lab's Qiskit reference
        run: |
          python hardware_campaign/noise_model/run_study.py --check
          python lab/make_reference.py --check
      - name: Reproduce the headline numbers
        run: python reproduce.py
      - name: Confirm frozen research artifacts remain unchanged
        run: python verify_research_pack.py .
      - name: Confirm tests did not rewrite tracked files
        run: git diff --exit-code
