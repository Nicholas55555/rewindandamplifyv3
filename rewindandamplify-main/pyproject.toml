[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrsm-grover"
version = "0.1.0"
description = "Rewind & Amplify: Grover's algorithm inside a quantum recurrent state machine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["qiskit==2.6.1", "qiskit-aer==0.18.2", "qiskit-ibm-runtime==0.51.0", "numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["qrsm_grover"]

[project.urls]
Repository = "https://github.com/Nicholas55555/rewindandamplify"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
